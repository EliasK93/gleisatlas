<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gleisatlas</title>
    <script>
      // Resolve the theme before the first paint (same key and rules as src/prefs.ts).
      (function () {
        var pick;
        try {
          pick = localStorage.getItem("gleisatlas-theme");
        } catch (e) {}
        document.documentElement.dataset.theme =
          pick === "light" || pick === "dark"
            ? pick
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
