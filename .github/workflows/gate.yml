# Runs the same gate as the pre-commit hook, in CI mode (see scripts/gate.py).
# Third-party actions, gitleaks and Bicep are pinned to a commit SHA or checksum; the runner image
# and Node are pinned to an exact version.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # az uses this verified binary from PATH ($RUNNER_TEMP/bin comes first, added above), never
      # the latest download or the runner image's own bicep.
      - name: Install Bicep 0.48.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  $RUNNER_TEMP/bin/bicep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bicep"
          az config set bicep.use_binary_from_path=true
          az bicep version

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium

      - name: Gate
        run: uv run python scripts/gate.py --ci
        env: # runner.temp is not available in job-level env
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/pytest.xml

      # The JUnit reports go to the badge job below, which holds the gist token: nothing this job
      # installs or runs (npm packages, the tests) shares a runner with that token.
      - name: Collect the test reports
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          cp "$RUNNER_TEMP/pytest.xml" "$RUNNER_TEMP/reports/" || true
          cp frontend/test-results/junit.xml "$RUNNER_TEMP/reports/" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: test-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore

  # Pushes the test counts to the public gist behind the README's tests badge. Runs on push to
  # main only, and also when tests failed, so the badge turns red. The gist is written with
  # a personal access token with Gists read/write (secret GIST_TOKEN): GITHUB_TOKEN cannot write gists.
  # The job installs nothing: scripts/tests_badge.py uses the standard library of the runner's
  # Python. The badge is written by repo code in a step without the secret; only curl gets the token.
  badge:
    needs: gate
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no artifact when the gate stopped before its last steps
        with:
          name: test-reports
          path: ${{ runner.temp }}/reports

      - name: Write tests badge
        env:
          BADGE: ${{ runner.temp }}/tests.json
        run: python3 scripts/tests_badge.py "$BADGE" "$RUNNER_TEMP/reports/pytest.xml" "$RUNNER_TEMP/reports/junit.xml"

      - name: Update tests badge
        env:
          GIST_ID: 3b48a1a6b1af4d54d8e76c88ed1e72d4
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BADGE: ${{ runner.temp }}/tests.json
        run: |
          [ -f "$BADGE" ] || exit 0
          jq -n --rawfile c "$BADGE" '{files: {"tests.json": {content: $c}}}' \
            | curl -sSf -X PATCH -H "Authorization: Bearer $GIST_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/gists/$GIST_ID" -d @- > /dev/null

  # Publishes the API image for the Azure deploy (scripts/azure.py) once the gate is green, on push
  # to main only. It is public, so Azure pulls it without credentials; the label links the package
  # to the repository. Only this job may write packages, and the Push step is the only one that gets the
  # token in its environment.
  image:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "ghcr.io/${GITHUB_REPOSITORY,,}-api:$GITHUB_SHA" .

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}-api:$GITHUB_SHA"
          docker logout ghcr.io
